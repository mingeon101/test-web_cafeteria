<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI 급식 신청</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #e1f5fa;
      --main: #7fbacf;
      --main-dark: #69a7bd;
      --text: #050505;
      --white: #ffffff;
      --danger: #e85b5b;
      --muted: #52636a;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      font-family: "Noto Sans KR", sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    .page {
      display: none;
      min-height: 100vh;
    }

    .page.active {
      display: block;
      animation: pageFade 0.25s ease;
    }

    @keyframes pageFade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .screen {
      min-height: 100vh;
      padding: 22px 26px 30px;
    }

    .app-label {
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.25;
      font-weight: 400;
      letter-spacing: -1.5px;
      margin-bottom: 4px;
    }

    .page-title {
      font-size: clamp(42px, 8vw, 64px);
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: -3px;
      margin-bottom: 38px;
    }

    .section-title {
      font-size: clamp(34px, 7vw, 52px);
      font-weight: 500;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    /* =========================
       학생 정보 입력
    ========================== */

    .recognition-screen {
      position: relative;
    }

    .student-card-button {
      position: absolute;
      top: 0;
      right: 22px;

      width: 142px;
      height: 142px;

      border: none;
      border-radius: 50%;

      background: #6da9bd;
      color: white;

      font-size: 31px;
      line-height: 1.45;
      font-weight: 500;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      padding: 15px;

      transition: transform 0.15s;
    }

    .student-card-button:active {
      transform: scale(0.96);
    }

    .student-input-area {
      margin-top: 80px;
      padding-left: 22px;
      padding-right: 22px;
    }

    .student-input-row {
      display: flex;
      align-items: center;
      margin-bottom: 42px;
      font-size: clamp(30px, 6vw, 45px);
    }

    .student-input-label {
      width: 145px;
      flex-shrink: 0;
      font-weight: 400;
    }

    .student-input {
      width: 135px;
      border: none;
      border-bottom: 3px solid transparent;

      background: transparent;
      outline: none;

      font-size: clamp(32px, 6vw, 45px);
      color: var(--text);

      padding: 4px 6px;
    }

    .student-input:focus {
      border-bottom-color: var(--main);
    }

    .main-wide-button {
      display: block;

      width: min(78%, 520px);
      min-height: 92px;

      margin: 55px auto 0;

      border: none;
      border-radius: 999px;

      background: var(--main);
      color: white;

      font-size: clamp(30px, 6vw, 42px);
      font-weight: 500;

      transition:
        transform 0.15s,
        background 0.15s;
    }

    .main-wide-button:hover {
      background: var(--main-dark);
    }

    .main-wide-button:active {
      transform: scale(0.98);
    }

    .main-wide-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .status-message {
      display: none;
      margin: 25px auto 0;
      width: min(90%, 560px);
      padding: 13px 18px;
      border-radius: 14px;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
    }

    .status-message.loading {
      display: block;
      background: rgba(255, 255, 255, 0.65);
      color: #355d6d;
    }

    .status-message.error {
      display: block;
      background: #ffeaea;
      color: #b93636;
    }

    .status-message.success {
      display: block;
      background: #e6f6e8;
      color: #32723a;
    }

    /* OCR */

    .ocr-panel {
      display: none;
      margin: 32px auto 0;
      width: min(100%, 600px);
    }

    .ocr-panel.visible {
      display: block;
    }

    .camera-box {
      position: relative;

      width: 100%;
      aspect-ratio: 4 / 3;

      overflow: hidden;
      border-radius: 20px;

      background: #111;
    }

    .camera-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .camera-guide {
      position: absolute;
      inset: 10%;
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      pointer-events: none;
    }

    .ocr-button-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .small-action {
      flex: 1;
      min-height: 58px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
    }

    .small-action.primary {
      background: var(--main);
      color: white;
    }

    .small-action.secondary {
      background: rgba(255, 255, 255, 0.65);
      color: #222;
    }

    /* =========================
       학생 확인
    ========================== */

    .confirm-content {
      padding-top: 35px;
    }

    .confirm-question {
      text-align: center;
      font-size: clamp(34px, 7vw, 50px);
      margin-top: 70px;
      margin-bottom: 45px;
      font-weight: 500;
    }

    .student-confirm-card {
      width: min(90%, 530px);

      margin: 0 auto;

      padding: 30px 26px;

      border: 3px solid #111;
      background: rgba(255, 255, 255, 0.18);
    }

    .confirm-student-name {
      font-size: clamp(38px, 7vw, 50px);
      font-weight: 600;
      margin-bottom: 15px;
    }

    .confirm-student-info {
      font-size: clamp(25px, 5vw, 34px);
      line-height: 1.7;
    }

    .confirm-button-row {
      display: flex;
      gap: 18px;

      width: min(90%, 530px);
      margin: 45px auto 0;
    }

    .confirm-btn {
      flex: 1;

      min-height: 78px;

      border: none;
      border-radius: 999px;

      font-size: clamp(23px, 5vw, 30px);
      font-weight: 600;
    }

    .confirm-btn.yes {
      background: var(--main);
      color: white;
    }

    .confirm-btn.no {
      background: rgba(255, 255, 255, 0.65);
      color: #222;
    }

    /* =========================
       선주문 선택
    ========================== */

    .menu-box {
      width: 100%;
      min-height: 86px;

      border: 3px solid #111;

      padding: 14px 28px;

      display: flex;
      align-items: center;

      font-size: clamp(25px, 5vw, 38px);

      line-height: 1.4;

      margin-bottom: 24px;
    }

    .count-section-title {
      font-size: clamp(34px, 7vw, 48px);
      font-weight: 400;

      margin: 4px 0 14px 18px;
    }

    .food-count-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;

      margin: 0 28px 30px;
    }

    .food-circle {
      aspect-ratio: 1 / 1;

      border-radius: 50%;

      background: var(--main);
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-width: 0;
      overflow: hidden;
    }

    .food-circle-name {
      max-width: 90%;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: clamp(20px, 4vw, 31px);
      margin-bottom: 5px;

      text-align: center;
    }

    .food-controls {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
    }

    .food-controls button {
      width: 30%;

      border: none;
      background: transparent;
      color: white;

      font-size: clamp(27px, 5vw, 38px);
      font-weight: 300;
      line-height: 1;
    }

    .food-count-number {
      width: 36%;

      text-align: center;

      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(30px, 6vw, 43px);
      font-weight: 400;
    }

    .allergy-section {
      margin: 0 20px 20px;
    }

    .allergy-title {
      font-size: clamp(20px, 4vw, 28px);
      margin-bottom: 5px;
    }

    .allergy-text {
      font-size: clamp(17px, 3.6vw, 25px);
      line-height: 1.65;
      word-break: keep-all;
    }

    /* =========================
       최종 확인
    ========================== */

    .final-description {
      font-size: clamp(20px, 4vw, 27px);
      color: #303030;
      margin-bottom: 27px;
    }

    .final-list {
      border-top: 3px solid #111;
      border-bottom: 3px solid #111;
    }

    .final-row {
      display: flex;
      align-items: center;

      min-height: 110px;

      padding: 12px 8px;

      border-bottom: 1px solid rgba(0, 0, 0, 0.3);
    }

    .final-row:last-child {
      border-bottom: none;
    }

    .final-food-info {
      flex: 1;

      display: flex;
      align-items: center;
      gap: 12px;

      min-width: 0;
    }

    .final-food-emoji {
      font-size: 33px;
    }

    .final-food-name {
      font-size: clamp(23px, 4.5vw, 32px);

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .final-counter {
      min-width: 190px;

      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .final-counter button {
      width: 52px;
      height: 52px;

      border: none;
      border-radius: 50%;

      background: var(--main);
      color: white;

      font-size: 28px;
      line-height: 1;
    }

    .final-count-number {
      min-width: 40px;

      text-align: center;

      font-family: "Space Grotesk", sans-serif;
      font-size: 35px;
    }

    /* =========================
       완료
    ========================== */

    .complete-center {
      min-height: calc(100vh - 60px);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .complete-icon {
      width: 120px;
      height: 120px;

      border-radius: 50%;
      background: var(--main);

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 58px;

      margin-bottom: 28px;
    }

    .complete-title {
      font-size: clamp(40px, 8vw, 60px);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .complete-sub {
      font-size: clamp(20px, 4vw, 27px);
      line-height: 1.7;
      color: #405159;
    }

    /* =========================
       시스템 중지
    ========================== */

    .system-stopped-overlay {
      display: none;

      position: fixed;
      inset: 0;
      z-index: 9999;

      background: rgba(22, 38, 45, 0.97);

      align-items: center;
      justify-content: center;
      flex-direction: column;

      text-align: center;

      padding: 35px;
    }

    .system-stopped-overlay.visible {
      display: flex;
    }

    .stop-icon {
      width: 110px;
      height: 110px;

      border-radius: 50%;

      border: 4px solid #ff6969;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ff6969;
      font-size: 57px;

      margin-bottom: 30px;
    }

    .stop-title {
      color: white;

      font-size: 38px;
      font-weight: 800;

      margin-bottom: 14px;
    }

    .stop-description {
      color: #dce6ea;

      font-size: 18px;
      line-height: 1.7;
    }

    .stop-reason {
      display: none;

      margin-top: 20px;

      border-radius: 15px;

      background: rgba(255, 255, 255, 0.09);

      color: #ffd1d1;

      padding: 12px 20px;

      font-size: 16px;
    }

    /* =========================
       반응형
    ========================== */

    @media (max-width: 600px) {
      .screen {
        padding-left: 20px;
        padding-right: 20px;
      }

      .student-card-button {
        width: 112px;
        height: 112px;

        right: 12px;

        font-size: 25px;
      }

      .student-input-area {
        margin-top: 70px;
        padding-left: 12px;
      }

      .food-count-grid {
        gap: 12px;
        margin-left: 4px;
        margin-right: 4px;
      }

      .final-counter {
        min-width: 165px;
        gap: 9px;
      }

      .final-counter button {
        width: 46px;
        height: 46px;
      }
    }

    @media (max-width: 390px) {
      .food-count-grid {
        gap: 7px;
      }

      .food-circle-name {
        font-size: 17px;
      }

      .food-controls button {
        font-size: 25px;
      }

      .food-count-number {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- =========================================
       1. 학생 정보 입력
  ========================================== -->

  <div class="page active" id="page-recognition">

    <div class="screen recognition-screen">

      <div class="app-label">
        AI 급식 신청
      </div>

      <div class="page-title">
        학생 정보 입력
      </div>

      <button
        class="student-card-button"
        onclick="toggleOCRPanel()"
      >
        학생증<br>인식
      </button>

      <div class="student-input-area">

        <div class="student-input-row">
          <div class="student-input-label">
            학년:
          </div>

          <input
            id="input-grade"
            class="student-input"
            type="number"
            min="1"
            max="12"
            placeholder="2"
          />
        </div>

        <div class="student-input-row">
          <div class="student-input-label">
            반:
          </div>

          <input
            id="input-class"
            class="student-input"
            type="number"
            min="1"
            placeholder="1"
          />
        </div>

        <div class="student-input-row">
          <div class="student-input-label">
            번호:
          </div>

          <input
            id="input-number"
            class="student-input"
            type="number"
            min="1"
            placeholder="8"
          />
        </div>

      </div>

      <div
        class="status-message"
        id="student-status"
      ></div>

      <button
        class="main-wide-button"
        id="student-search-button"
        onclick="searchStudentByInfo()"
      >
        확인
      </button>


      <!-- 학생증 OCR -->

      <div
        class="ocr-panel"
        id="ocr-panel"
      >

        <div class="camera-box">

          <video
            id="video-recognition"
            autoplay
            muted
            playsinline
          ></video>

          <div class="camera-guide"></div>

        </div>

        <div class="ocr-button-row">

          <button
            class="small-action primary"
            id="ocr-capture-button"
            onclick="captureStudentCard()"
          >
            학생증 촬영
          </button>

          <button
            class="small-action secondary"
            onclick="closeOCRPanel()"
          >
            닫기
          </button>

        </div>

        <canvas
          id="ocr-canvas"
          style="display:none"
        ></canvas>

      </div>

    </div>

  </div>


  <!-- =========================================
       2. 학생 확인
  ========================================== -->

  <div class="page" id="page-confirm">

    <div class="screen confirm-content">

      <div class="app-label">
        AI 급식 신청
      </div>

      <div class="page-title">
        학생 확인
      </div>

      <div class="confirm-question">
        이 학생이 맞나요?
      </div>

      <div class="student-confirm-card">

        <div
          class="confirm-student-name"
          id="confirm-name"
        >
          홍길동
        </div>

        <div
          class="confirm-student-info"
          id="confirm-info"
        >
          2학년 1반 8번
        </div>

      </div>

      <div class="confirm-button-row">

        <button
          class="confirm-btn no"
          onclick="returnToRecognition()"
        >
          아니에요
        </button>

        <button
          class="confirm-btn yes"
          onclick="confirmStudent()"
        >
          맞아요
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================
       3. 선주문 횟수 선택
  ========================================== -->

  <div class="page" id="page-preorder">

    <div class="screen">

      <div class="app-label">
        AI 급식 신청
      </div>

      <div class="section-title">
        오늘의 메뉴
      </div>

      <div
        class="menu-box"
        id="today-menu-box"
      >
        밥, 미역국, 김치
      </div>

      <div class="count-section-title">
        횟수
      </div>

      <div
        class="food-count-grid"
        id="preorder-food-grid"
      ></div>

      <div class="allergy-section">

        <div class="allergy-title">
          *알레르기 정보
        </div>

        <div
          class="allergy-text"
          id="allergy-text"
        >
          불러오는 중...
        </div>

      </div>

      <button
        class="main-wide-button"
        onclick="openFinalConfirm()"
      >
        제출
      </button>

    </div>

  </div>


  <!-- =========================================
       4. 최종 확인
  ========================================== -->

  <div class="page" id="page-final-confirm">

    <div class="screen">

      <div class="app-label">
        AI 급식 신청
      </div>

      <div class="page-title">
        최종 확인
      </div>

      <div class="final-description">
        신청할 횟수를 확인해주세요.<br>
        횟수는 아래에서 바로 수정할 수 있습니다.
      </div>

      <div
        class="final-list"
        id="final-confirm-list"
      ></div>

      <button
        class="main-wide-button"
        id="final-submit-button"
        onclick="submitFinalPreorder()"
      >
        최종 제출
      </button>

    </div>

  </div>


  <!-- =========================================
       5. 완료
  ========================================== -->

  <div class="page" id="page-complete">

    <div class="screen">

      <div class="complete-center">

        <div class="complete-icon">
          ✓
        </div>

        <div class="complete-title">
          신청 완료
        </div>

        <div class="complete-sub">
          급식 신청이 완료되었습니다.<br>
          맛있는 급식 시간 보내세요!
        </div>

        <button
          class="main-wide-button"
          onclick="resetAll()"
        >
          처음으로
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================================
     시스템 작동 중지
========================================== -->

<div
  class="system-stopped-overlay"
  id="system-stopped-overlay"
>

  <div class="stop-icon">
    ✕
  </div>

  <div class="stop-title">
    작동 중지
  </div>

  <div class="stop-description">
    관리자가 급식 신청 시스템을<br>
    일시 중지했습니다.<br>
    잠시만 기다려 주세요.
  </div>

  <div
    class="stop-reason"
    id="stop-reason"
  ></div>

</div>


<script>

/* ============================================================
   FIREBASE
============================================================ */

const firebaseConfig = {

/* ============================================================
   기본 상태
============================================================ */

const FOODS = [
  "밥",
  "국",
  "김치"
];

const EMOJIS = [
  "🍚",
  "🍲",
  "🥬"
];

let menuLabels = {
  "밥": "밥",
  "국": "국",
  "김치": "김치"
};

let menuAllergies = [];

let user = {
  uid: null,
  name: "",
  grade: null,
  classNum: null,
  number: null
};

let preorderCounts = [
  0,
  0,
  0
];

let todayPreorder = null;

let systemOperating = true;

let GEMINI_API_KEY = "";

const GEMINI_MODEL =
  "gemini-3.1-flash-lite";

let GEMINI_ENDPOINT = "";


async function initGeminiKey() {

  try {

    const res =
      await fetch("/.netlify/functions/get-key");

    if (res.ok) {

      const json =
        await res.json();

      GEMINI_API_KEY =
        json.apiKey || "";

    }

  } catch (err) {

    console.warn(
      "Gemini API key 로드 실패:",
      err
    );

  }

  GEMINI_ENDPOINT =
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;

}

function goPage(name) {

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove("active");

    });

  const target =
    document.getElementById(
      "page-" + name
    );

  if (!target) {
    return;
  }

  target.classList.add("active");

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

}

);



function parseAllergies(data) {

  if (!data) {
    return [];
  }


  /* 배열 */

  if (Array.isArray(data)) {

    return [
      ...new Set(
        data.filter(Boolean)
      )
    ];

  }


  /* 문자열 */

  if (
    typeof data === "string"
  ) {

    return [
      ...new Set(
        data
          .split(/[,/\n]/)
          .map(v => v.trim())
          .filter(Boolean)
      )
    ];

  }


  /* 객체 */

  if (
    typeof data === "object"
  ) {

    const result = [];

    Object
      .values(data)
      .forEach(value => {

        if (
          Array.isArray(value)
        ) {

          result.push(
            ...value
          );

        } else if (
          typeof value ===
          "string"
        ) {

          result.push(
            ...value
              .split(/[,/\n]/)
              .map(v =>
                v.trim()
              )
          );

        } else if (
          value &&
          typeof value ===
          "object"
        ) {

          Object
            .values(value)
            .forEach(v => {

              if (
                typeof v ===
                "string"
              ) {

                result.push(v);

              }

            });

        }

      });

    return [
      ...new Set(
        result.filter(Boolean)
      )
    ];

  }


  return [];

}



function renderAllergies() {

db.ref("system").on(
  "value",
  snapshot => {

    const data =
      snapshot.val();

    const previous =
      systemOperating;

    systemOperating =
      data
        ? data.operating !== false
        : true;

    lastStopReason =
      data?.reason || null;


    if (
      previous &&
      !systemOperating
    ) {

      showStoppedOverlay();

    } else if (
      !previous &&
      systemOperating
    ) {

      hideStoppedOverlay();

    } else if (
      !systemOperating
    ) {

      renderStopReason();

    }

  }
);



function showStoppedOverlay() {

  stopRecognitionCamera();

  document
    .getElementById(
      "system-stopped-overlay"

}

/* ============================================================
   학생 조회
   학년 + 반 + 번호
============================================================ */

async function searchStudentByInfo() {

  if (!systemOperating) {
    return;
  }


  const grade =
    Number(
      document
        .getElementById(
          "input-grade"
        )
        .value
    );

  const classNum =
    Number(
      document
        .getElementById(
          "input-class"
        )
        .value
    );

  const number =
    Number(
      document
        .getElementById(
          "input-number"
        )
        .value
    );


  if (
    !grade ||
    !classNum ||
    !number
  ) {

    setStudentStatus(
      "error",
      "학년, 반, 번호를 모두 입력해주세요."
    );

    return;

  }


  const button =
    document.getElementById(
      "student-search-button"
    );

  button.disabled = true;
  button.textContent =
    "조회 중...";

  setStudentStatus(
    "loading",
    "학생 정보를 확인하고 있습니다..."
  );


  try {

    const snapshot =
      await db
        .ref("students")
        .once("value");


    let found = null;


    snapshot.forEach(
      child => {

        if (found) {
          return;
        }

        const s =
          child.val() || {};


        const studentGrade =
          Number(
            s.grade ??
            s["학년"]
          );

        const studentClass =
          Number(
            s.class ??
            s.classNum ??
            s["반"]
          );

        const studentNumber =
          Number(
            s.number ??
            s["번호"]
          );


        if (
          studentGrade ===
            grade &&
          studentClass ===
            classNum &&
          studentNumber ===
            number
        ) {

          found = {
            uid: child.key,

            name:
              s.name ||
              s["이름"] ||
              "이름 없음",

            grade:
              studentGrade,

            classNum:
              studentClass,

            number:
              studentNumber
          };

        }

      }
    );


    if (!found) {

      setStudentStatus(
        "error",
        "해당 학생을 찾을 수 없습니다."
      );

      return;

    }


    user = found;

    setStudentStatus(
      "success",
      `${user.name} 학생을 찾았습니다.`
    );

    await loadExistingPreorder();

    openStudentConfirm();


  } catch (err) {

    console.error(
      "학생 조회 실패:",
      err
    );

    setStudentStatus(
      "error",
      "학생 정보 조회에 실패했습니다."
    );

  } finally {

    button.disabled = false;
    button.textContent =
      "확인";

  }

}



/* ============================================================
   이름으로 학생 조회
   OCR 학생증용
============================================================ */

async function lookupStudentByName(
  name
) {

  const snapshot =
    await db
      .ref("students")
      .orderByChild("name")
      .equalTo(name)
      .once("value");


  if (
    !snapshot.exists()
  ) {

    return null;

  }


  const data =
    snapshot.val();

  const uid =
    Object.keys(data)[0];

  const s =
    data[uid];


  return {

    uid,

    name:
      s.name || name,

    grade:
      s.grade ??
      s["학년"] ??
      null,

    classNum:
      s.class ??
      s.classNum ??
      s["반"] ??
      null,

    number:
      s.number ??
      s["번호"] ??
      null

  };

}



/* ============================================================
   학생증 OCR 패널
============================================================ */

async function toggleOCRPanel() {

  const panel =
    document.getElementById(
      "ocr-panel"
    );


  if (
    panel.classList.contains(
      "visible"
    )
  ) {

    closeOCRPanel();
    return;

  }


  panel.classList.add(
    "visible"
  );

  await startRecognitionCamera();

}



function closeOCRPanel() {

  document
    .getElementById(
      "ocr-panel"
    )
    .classList.remove(
      "visible"
    );

  stopRecognitionCamera();

}



async function startRecognitionCamera() {

  if (!systemOperating) {
    return;
  }


  stopRecognitionCamera();


  const video =
    document.getElementById(
      "video-recognition"
    );


  try {

    recognitionStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          }

        });


    video.srcObject =
      recognitionStream;


  } catch (err) {

    console.warn(
      "후면 카메라 실패:",
      err
    );


    try {

      recognitionStream =
        await navigator
          .mediaDevices
          .getUserMedia({
            video: true
          });

      video.srcObject =
        recognitionStream;

    } catch (err2) {

      setStudentStatus(
        "error",
        "카메라를 사용할 수 없습니다."
      );

    }

  }

}



function stopRecognitionCamera() {

  if (
    recognitionStream
  ) {

    recognitionStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    recognitionStream =
      null;

  }


  const video =
    document.getElementById(
      "video-recognition"
    );

  if (video) {

    video.srcObject =
      null;

  }

}



/* ============================================================
   OCR 실행
============================================================ */

async function captureStudentCard() {

  if (
    !GEMINI_API_KEY
  ) {

    setStudentStatus(
      "error",
      "OCR API 키를 불러오지 못했습니다."
    );

    return;

  }


  const video =
    document.getElementById(
      "video-recognition"
    );

  const canvas =
    document.getElementById(
      "ocr-canvas"
    );

  const button =
    document.getElementById(
      "ocr-capture-button"
    );


  if (
    !video.videoWidth
  ) {

    setStudentStatus(
      "error",
      "카메라 준비를 기다려주세요."
    );

    return;

  }


  button.disabled = true;
  button.textContent =
    "인식 중...";

  setStudentStatus(
    "loading",
    "학생증에서 이름을 인식하고 있습니다..."
  );


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const imageBase64 =
    canvas
      .toDataURL(
        "image/jpeg",
        0.9
      )
      .split(",")[1];


  try {

    const response =
      await fetch(
        GEMINI_ENDPOINT,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              contents: [
                {

                  parts: [

                    {
                      text:
                        "이 학생증 또는 명찰 이미지에서 학생의 사람 이름만 읽어주세요. 이름만 답하세요. 읽을 수 없다면 NONE이라고 답하세요."
                    },

                    {
                      inline_data: {
                        mime_type:
                          "image/jpeg",

                        data:
                          imageBase64
                      }
                    }

                  ]

                }
              ],

              generationConfig: {
                temperature: 0.1
              }

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error?.message ||
        "OCR 요청 실패"
      );

    }


    const rawName =
      (
        data
          ?.candidates?.[0]
          ?.content
          ?.parts?.[0]
          ?.text || ""
      )
        .trim()
        .replace(
          /[`"'*.]/g,
          ""
        );


    if (
      !rawName ||
      rawName === "NONE"
    ) {

      setStudentStatus(
        "error",
        "학생 이름을 인식하지 못했습니다."
      );

      return;

    }


    const student =
      await lookupStudentByName(
        rawName
      );


    if (!student) {

      setStudentStatus(
        "error",
        `"${rawName}" 학생을 찾지 못했습니다.`
      );

      return;

    }


    user = student;


    document
      .getElementById(
        "input-grade"
      )
      .value =
      user.grade || "";

    document
      .getElementById(
        "input-class"
      )
      .value =
      user.classNum || "";

    document
      .getElementById(
        "input-number"
      )
      .value =
      user.number || "";


    setStudentStatus(
      "success",
      `${user.name} 학생을 인식했습니다.`
    );


    await loadExistingPreorder();

    closeOCRPanel();

    openStudentConfirm();


  } catch (err) {

    console.error(
      "OCR 오류:",
      err
    );

    setStudentStatus(
      "error",
      "학생증 인식에 실패했습니다."
    );

  } finally {

    button.disabled = false;
    button.textContent =
      "학생증 촬영";

  }

}

function todayDateKey() {

  return new Date()
    .toLocaleDateString(
      "sv-SE"
    );

}



/* ============================================================
   기존 오늘 선주문 로드

   구조 그대로 유지:
   students/{uid}/preorders/{YYYY-MM-DD}
============================================================ */

async function loadExistingPreorder() {

  if (!user.uid) {

    todayPreorder = null;

    preorderCounts = [
      0,
      0,
      0
    ];

    return;

  }


  try {

    const snapshot =
      await db
        .ref(
          `students/${user.uid}/preorders/${todayDateKey()}`
        )
        .once("value");


    if (
      snapshot.exists()
    ) {

      todayPreorder =
        snapshot.val();


      preorderCounts = [

        Number(
          todayPreorder
            ?.foods?.["밥"]
        ) || 0,

        Number(
          todayPreorder
            ?.foods?.["국"]
        ) || 0,

        Number(
          todayPreorder
            ?.foods?.["김치"]
        ) || 0

      ];

    } else {

      todayPreorder = null;

      preorderCounts = [
        0,
        0,
        0
      ];

    }

  } catch (err) {

    console.error(
      "기존 선주문 조회 실패:",
      err
    );


    todayPreorder = null;

    preorderCounts = [
      0,
      0,
      0
    ];

  }

}

function changePreorderCount(
  index,
  amount
) {

  preorderCounts[index] =
    Math.max(
      0,

      Number(
        preorderCounts[index]
      ) +
      amount
    );


  const el =
    document.getElementById(
      `preorder-count-${index}`
    );


  if (el) {

    el.textContent =
      preorderCounts[index];

  }

}

/* ============================================================
   최종 선주문 저장

   기존 Firebase 구조 그대로:

   preorders/{날짜}/{uid}

   students/{uid}/preorders/{날짜}
============================================================ */

async function submitFinalPreorder() {

  if (!user.uid) {

    alert(
      "학생 정보가 없습니다."
    );

    return;

  }


  const button =
    document.getElementById(
      "final-submit-button"
    );


  button.disabled = true;
  button.textContent =
    "저장 중...";


  const dateKey =
    todayDateKey();


  const foods = {

    "밥":
      preorderCounts[0] || 0,

    "국":
      preorderCounts[1] || 0,

    "김치":
      preorderCounts[2] || 0

  };


  const total =
    (preorderCounts[0] || 0) +
    (preorderCounts[1] || 0) +
    (preorderCounts[2] || 0);


  /*
    기존 선주문이 있으면 createdAt 유지
    수정한 경우 최초 신청시간이 바뀌지 않도록 처리
  */

  const preorderData = {

    name:
      user.name,

    grade:
      user.grade,

    classNum:
      user.classNum,

    number:
      user.number,

    foods,

    total,

    status:
      "pending",

    createdAt:
      todayPreorder?.createdAt ||
      Date.now(),

    updatedAt:
      Date.now()

  };


  try {

    await Promise.all([

      db
        .ref(
          `preorders/${dateKey}/${user.uid}`
        )
        .set(
          preorderData
        ),

      db
        .ref(
          `students/${user.uid}/preorders/${dateKey}`
        )
        .set(
          preorderData
        )

    ]);


    todayPreorder =
      preorderData;


    goPage(
      "complete"
    );


  } catch (err) {

    console.error(
      "선주문 저장 실패:",
      err
    );


    alert(
      "급식 신청 저장에 실패했습니다. 다시 시도해주세요."
    );


  } finally {

    button.disabled = false;
    button.textContent =
      "최종 제출";

  }

}



/* ============================================================
   초기화
============================================================ */

function resetAll() {

  stopRecognitionCamera();


  user = {
    uid: null,
    name: "",
    grade: null,
    classNum: null,
    number: null
  };


  preorderCounts = [
    0,
    0,
    0
  ];


  todayPreorder = null;


  document
    .getElementById(
      "input-grade"
    )
    .value = "";


  document
    .getElementById(
      "input-class"
    )
    .value = "";


  document
    .getElementById(
      "input-number"
    )
    .value = "";


  document
    .getElementById(
      "ocr-panel"
    )
    .classList.remove(
      "visible"
    );


  setStudentStatus(
    null,
    ""
  );


  renderPreorderSelection();
  renderFinalConfirm();


  goPage(
    "recognition"
  );

}



/* ============================================================
   HTML escape
============================================================ */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}



/* ============================================================
   INIT
============================================================ */

(async function init() {

  await initGeminiKey();

  renderTodayMenu();
  renderAllergies();
  renderPreorderSelection();

})();
</script>
